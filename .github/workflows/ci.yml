name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # actions/checkout v6.1.0 (commit SHA resolved from the upstream tag via git ls-remote)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Quality gate
        run: scripts/check.sh
      - name: Build signed app bundle
        run: scripts/build-app.sh
      - name: Binary security checks
        run: scripts/security-check.sh --app
